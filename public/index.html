<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Book Log</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.525.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <aside>
    <div class="logo-area">
      <i data-lucide="book-open"></i>
      <span>My Book Log</span>
    </div>

    <div class="category-section">
      <h3>Categories</h3>
      <ul class="category-list" id="categoryList"></ul>
    </div>

    <button class="add-category-btn admin-only" id="addCategoryBtn">
      <i data-lucide="plus"></i>
      <span>카테고리 추가</span>
    </button>

    <button class="admin-toggle-btn" id="adminToggleBtn">
      <i data-lucide="lock" id="adminToggleIcon"></i>
      <span id="adminToggleLabel">관리자로 로그인</span>
    </button>

    <p class="status-note" id="statusNote"></p>
  </aside>

  <main>
    <header>
      <div class="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="책 제목, 코멘트 검색...">
      </div>
      <button class="write-btn admin-only" id="writeBtn">
        <i data-lucide="square-pen"></i>
        <span>기록하기</span>
      </button>
    </header>

    <div id="bookGridWrap"></div>
  </main>
</div>

<!-- 책 추가/수정 모달 -->
<div class="overlay" id="bookOverlay">
  <div class="modal modal-wide">
    <h2 id="modalTitle">새 기록 추가</h2>

    <div class="field">
      <label>표지 사진 (선택)</label>
      <div class="cover-upload-row">
        <div class="cover-preview" id="coverPreview"><i data-lucide="image"></i></div>
        <div class="cover-upload-actions">
          <div class="cover-btn-row">
            <button type="button" class="cover-btn" id="coverPickBtn"><i data-lucide="upload"></i><span>사진 선택</span></button>
            <button type="button" class="cover-btn" id="coverRemoveBtn" style="display:none;"><i data-lucide="x"></i><span>제거</span></button>
          </div>
          <span class="cover-hint" id="coverHint">책 표지나 관련 사진을 추가해보세요.</span>
        </div>
        <input type="file" id="inCoverFile" accept="image/*" style="display:none;">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>책 제목</label>
        <input type="text" id="inTitle" placeholder="예: 불편한 편의점">
      </div>
      <div class="field">
        <label>저자 (선택)</label>
        <input type="text" id="inAuthor" placeholder="예: 김호연">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>카테고리</label>
        <select id="inCategory"></select>
      </div>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="inDate">
      </div>
    </div>

    <div class="field">
      <label>별점</label>
      <div class="star-picker" id="starPicker"></div>
    </div>

    <div class="field">
      <label>기록 (블로그처럼 자유롭게 써보세요)</label>
      <div id="noteEditor" class="note-editor"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancel">취소</button>
      <button class="btn btn-solid" id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- 카테고리 추가 모달 -->
<div class="overlay" id="catOverlay">
  <div class="modal cat-modal">
    <h2>새 카테고리</h2>
    <p class="hint">예: 소설 / 추리, 에세이 / 시, 자기계발...</p>
    <div class="field">
      <input type="text" id="inCatName" placeholder="카테고리 이름">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCatCancel">취소</button>
      <button class="btn btn-solid" id="btnCatSave">추가</button>
    </div>
  </div>
</div>

<!-- 관리자 로그인 모달 -->
<div class="overlay" id="adminOverlay">
  <div class="modal cat-modal">
    <h2>관리자 로그인</h2>
    <p class="hint">비밀번호를 입력하면 글쓰기/수정/삭제가 가능해져요. 이 브라우저에는 계속 로그인 상태가 유지돼요.</p>
    <div class="field">
      <input type="password" id="inAdminPassword" placeholder="비밀번호">
    </div>
    <p class="admin-error" id="adminError"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnAdminCancel">취소</button>
      <button class="btn btn-solid" id="btnAdminLogin">로그인</button>
    </div>
  </div>
</div>

<!-- 블로그 스타일 상세보기 -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-topbar">
    <button class="icon-btn" id="detailClose"><i data-lucide="arrow-left"></i></button>
    <div class="detail-actions admin-only">
      <button class="icon-btn" id="detailEdit"><i data-lucide="pencil"></i></button>
      <button class="icon-btn danger" id="detailDelete"><i data-lucide="trash-2"></i></button>
    </div>
  </div>
  <article class="detail-article" id="detailArticle"></article>
</div>

<script src="app.js"></script>
</body>
</html>
